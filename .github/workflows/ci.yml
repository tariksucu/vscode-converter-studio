name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Dependencies' install scripts are not needed to lint, test or package.
      - name: Install dependencies
        run: 'npm ci --ignore-scripts'

      - name: Lint
        run: 'npm run lint'

      - name: Type check
        run: 'npm run typecheck'

      # Unit tests with a fake Converter Studio API: no network, no API key.
      - name: Run tests
        run: 'npm test'

      # vsce checks the manifest, the icon, the README's images and secrets while packaging.
      - name: Package the extension
        run: 'npx vsce package --out converter-studio.vsix'
